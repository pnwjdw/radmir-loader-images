[package]
name = "hassle-studio"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"

[lib]
name = "HassleStudio"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "HassleStudioLauncher"
path = "src/launcher/main.rs"

[dependencies]
egui = { version = "0.31", default-features = false, features = ["default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
image = { version = "0.25", default-features = false, features = ["png", "gif"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true
